# Based-on: https://github.com/lfnovo/open-notebook/blob/main/examples/docker-compose-ollama.yml

# Docker Compose with Ollama (Free Local AI)
#
# Usage:
#   1. Copy this file to your project folder as docker-compose.yml
#   2. Change OPEN_NOTEBOOK_ENCRYPTION_KEY below
#   3. Run: docker compose up -d
#   4. Pull a model: docker exec open_notebook-ollama-1 ollama pull mistral
#   5. Configure Ollama in UI: Settings → API Keys → Add Ollama (URL: http://ollama:11434)

services:
  surrealdb:
    image: surrealdb/surrealdb:v2.6.5
    command: start --log info --user root --pass root rocksdb:/mydata/mydatabase.db
    user: root
    volumes:
      - surreal_data:/mydata
    networks:
      - open_notebook_private
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: always
    pull_policy: always

  open_notebook:
    image: lfnovo/open_notebook:1.8.5
    ports:
      - "8502:8502"
      - "5055:5055"
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=some-string
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - notebook_data:/app/data
    networks:
      - open_notebook_public
      - open_notebook_private
      - ollama_public
    depends_on:
      - surrealdb
    restart: always
    pull_policy: always

networks:
  open_notebook_public:
    name: open_notebook_public
    driver: bridge
  open_notebook_private:
  ollama_public:
    name: ollama_public
    external: true

volumes:
  notebook_data:
  surreal_data:
  ollama_models:
